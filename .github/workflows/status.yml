name: Update status table

on:
  push:
    branches: [main]
    paths: ["translations/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: status
  cancel-in-progress: false

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rewrite the table in README.md
        run: python3 scripts/check.py --readme
      - name: Push the new table to the status-table branch
        run: |
          if git diff --quiet; then
            echo "The table is already up to date." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c status-table
          git commit -am "Update translation status"
          git push --force origin status-table
          echo "main is protected, so the new table waits on the \`status-table\` branch. Open a pull request from it: ${{ github.server_url }}/${{ github.repository }}/compare/main...status-table?expand=1" >> "$GITHUB_STEP_SUMMARY"
