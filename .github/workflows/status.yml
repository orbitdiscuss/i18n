name: Update status table

on:
  push:
    branches: [main]
    paths: ["translations/**"]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: status
  cancel-in-progress: false

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rewrite the table in README.md
        run: python3 scripts/check.py --readme
      - name: Open or update the status pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "The table is already up to date." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c status-table
          git commit -am "Update translation status"
          git push --force origin status-table
          if [ -z "$(gh pr list --head status-table --state open --json number -q '.[].number')" ]; then
            gh pr create --base main --head status-table \
              --title "Update translation status" \
              --body "The status table in README.md, refreshed from translations/. Generated by \`python3 scripts/check.py --readme\`."
          fi
